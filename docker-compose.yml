services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    container_name: smart-cairo-backend

  frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    container_name: smart-cairo-frontend